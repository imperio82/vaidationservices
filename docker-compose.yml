services:
  mongo:
    image: mongo:7
    container_name: validations-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  dynamodb:
    image: amazon/dynamodb-local
    container_name: validations-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

volumes:
  mongo-data:
